<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>青云挂机录 — 下载</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#1a1a2e;color:#e0d6c2;font-family:'Noto Serif SC','SimSun','STSong',serif;
  background-image:radial-gradient(ellipse at 50% 20%,#16213e 0%,#1a1a2e 70%)}
.card{max-width:460px;width:90%;text-align:center;padding:48px 36px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;backdrop-filter:blur(8px)}
h1{font-size:28px;font-weight:700;color:#f0e6d3;margin-bottom:6px;letter-spacing:4px}
.sub{font-size:14px;color:#8a7e6b;margin-bottom:32px}
.ver{display:inline-block;background:rgba(212,175,55,0.15);color:#d4af37;
  font-size:13px;padding:3px 12px;border-radius:20px;margin-bottom:24px}
.dl-btn{display:inline-block;padding:14px 48px;font-size:17px;font-family:inherit;
  background:linear-gradient(135deg,#d4af37,#aa8a2e);color:#1a1a2e;font-weight:700;
  border:none;border-radius:8px;cursor:pointer;text-decoration:none;
  transition:transform .15s,box-shadow .15s;letter-spacing:2px}
.dl-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(212,175,55,0.3)}
.dl-btn:active{transform:translateY(0)}
.hint{margin-top:20px;font-size:13px;color:#6a6252;line-height:1.8}
.notes{margin-top:28px;text-align:left;font-size:13px;color:#8a7e6b;
  border-top:1px solid rgba(255,255,255,0.06);padding-top:20px;line-height:2}
.notes summary{cursor:pointer;color:#b0a48c;font-size:14px;margin-bottom:8px}
.notes ul{padding-left:1.2em}
.notes li{margin-bottom:2px}
#status{margin-top:12px;font-size:13px;color:#d4af37;min-height:1.4em}
</style>
</head>
<body>
<div class="card">
  <h1>青云挂机录</h1>
  <p class="sub">单机 · 纯文本水墨修仙 · 挂机养成</p>
  <div class="ver" id="ver-tag">加载中…</div>
  <br><br>
  <button class="dl-btn" id="dl-btn" onclick="downloadGame()">下载游戏</button>
  <div class="hint">
    下载后双击 HTML 文件即可开始，无需安装<br>
    存档保存在浏览器本地，建议定期导出备份
  </div>
  <div id="status"></div>
  <details class="notes" id="notes-section">
    <summary>更新日志</summary>
    <div id="notes-content"></div>
  </details>
</div>
<script>
async function downloadGame() {
  const btn = document.getElementById('dl-btn');
  const statusEl = document.getElementById('status');
  btn.disabled = true;
  btn.textContent = '下载中…';
  statusEl.textContent = '';
  try {
    const resp = await fetch('qingyun.html?v=' + Date.now());
    if (!resp.ok) throw new Error('下载失败：' + resp.status);
    const blob = await resp.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '青云挂机录.html';
    a.click();
    URL.revokeObjectURL(a.href);
    statusEl.textContent = '下载完成，双击文件即可开玩';
  } catch(e) {
    statusEl.textContent = '下载失败，请刷新重试';
  }
  btn.disabled = false;
  btn.textContent = '下载游戏';
}
(async () => {
  const verTag = document.getElementById('ver-tag');
  const notesContent = document.getElementById('notes-content');
  try {
    const resp = await fetch('update.json?t=' + Date.now());
    if (!resp.ok) throw new Error(resp.status);
    const data = await resp.json();
    verTag.textContent = 'v' + data.version;
    if (data.notes) {
      const lines = data.notes.split('\n').filter(l => l.trim());
      const items = lines.slice(1);
      let html = '';
      if (items.length) {
        html += '<ul>' + items.map(l => '<li>' + l.replace(/^\d+\.\s*/, '') + '</li>').join('') + '</ul>';
      } else {
        html = '<p>' + lines[0] + '</p>';
      }
      notesContent.innerHTML = html;
    }
  } catch(e) {
    verTag.textContent = '版本未知';
    notesContent.innerHTML = '<p style="color:#6a6252">无法加载更新信息</p>';
  }
})();
</script>
</body>
</html>
